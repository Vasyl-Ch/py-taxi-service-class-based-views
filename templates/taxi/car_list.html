{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>

  {% if car_list %}
    <table>
      {% for car in car_list %}
        <li>
          <a href="{% url 'taxi:car-detail' car.id %}">
            {{ car.id }}
          </a>
        <p>{{ car.model }}</p>
        </li>
      {% endfor %}
    </table>
  {% else %}
    <p>No cars found.</p>
  {% endif %}
{% endblock %}
